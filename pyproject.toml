[project]
name = "tscheduler"
version = "0.1.0"
description = "Real-time visible-light telescope night scheduler"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "astropy>=6.1",
    "ortools>=9.11",
    "sgp4>=2.23",
    "httpx>=0.27",
    "tenacity>=9.0",
    "structlog>=24.4",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tscheduler"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "SIM", "RUF", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
"scripts/**" = ["T20"]   # CLI tools print by definition
"src/tscheduler/core/clock.py" = ["DTZ"]   # the one module allowed to read a wall clock

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/tscheduler"]

[[tool.mypy.overrides]]
module = ["tscheduler.physics.*", "tscheduler.pipeline.*"]
disallow_any_explicit = false

# These ship no py.typed marker. We type our own boundaries instead.
[[tool.mypy.overrides]]
module = ["astropy.*", "ortools.*", "sgp4.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q --strict-markers -m 'not network'"
testpaths = ["tests"]
markers = ["slow: long-running", "network: requires network (deselected by default)"]
